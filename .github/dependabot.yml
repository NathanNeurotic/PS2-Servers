# Keeps the SHA-pinned GitHub Actions and the pinned build dependencies current.
# Without this, pinned versions silently rot and accumulate known-CVE versions,
# which itself becomes a trust/reputation issue over time.
version: 2
updates:
  # GitHub Actions are pinned to commit SHAs (with a # vN comment). Dependabot
  # bumps both the SHA and the comment when a new release ships.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Python build dependencies pinned in requirements-build.txt (Nuitka, etc.).
  - package-ecosystem: "pip"
    directory: "/"
    # The Windows 7 pins in build/ must never be bumped (see the /build entry).
    exclude-paths:
      - "build/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # build/requirements-win7.txt pins the 32-bit Windows (Windows 7 / 8) build to
  # the last releases that still support Python 3.8 (issue #330). Every newer
  # zstandard, lz4 and Pillow drops Python 3.8, so any bump there breaks the
  # Windows 7 package. This entry exists only to turn Dependabot off for that
  # file: the ignore rule also stops security-update pull requests for it, which
  # otherwise open with Dependabot's defaults (#332). Bump that file by hand, and
  # only to a version that still ships Python 3.8 wheels.
  - package-ecosystem: "pip"
    directory: "/build"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
