name: Build release binaries

# Builds the single-file launcher for each platform and, when triggered by a
# version tag like v0.1.0, attaches the binaries to the matching GitHub Release.
# Use the manual "Run workflow" button to test-build without publishing.
#
# Both macOS builds run on the fast-scheduling Apple-Silicon runner: the arm64
# one natively, and the Intel (x86_64) one cross-built with a universal2 Python
# running under its x86_64 slice so native Python extensions match the artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Runs before anything is built, because the failure it catches is only
  # expensive once it has shipped. Edge takes its version from the tag while the
  # launcher takes its own from launcher/release_metadata.py, so tagging v0.5.0
  # while the source still said 0.4.9 would publish binaries labelled both, and a
  # bug report could honestly quote either number. Seconds here rather than a
  # twenty-minute matrix followed by a bad release.
  #
  # Not gated on `if: startsWith(github.ref, 'refs/tags/')` -- a skipped job would
  # skip everything that needs it. The script no-ops when there is no tag.
  verify-version:
    name: Verify tag matches source version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version in the source against the tag
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/version_source.py --check-sources
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 tools/version_source.py --check-tag "$GITHUB_REF_NAME"
          else
            echo "not a tag build; source version is $(python3 tools/version_source.py --print-display)"
          fi

  # Create one draft before the build jobs. The publish job below is the only
  # step that attaches assets, sets the notes, and publishes the release.
  create-release:
    name: Create the release up front
    needs: verify-version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release if it is not there yet
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # --repo, not a checkout: gh resolves the repo from the working
          # directory otherwise, and this job has nothing checked out.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release for $TAG already exists; nothing to create"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" \
            --notes "The binaries for this release are still being built: the download table and the files land here when the build finishes (about ten minutes). If this text is still here later, the build failed -- see the Actions tab."

  build:
    name: Build ${{ matrix.asset }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PS2Servers-windows-x64.zip
            portable_asset: PS2Servers-windows-x64-portable.zip
          # 32-bit Windows, for older / low-end PCs still used for SMB on OPL.
          - os: windows-latest
            asset: PS2Servers-windows-x86.zip
            portable_asset: PS2Servers-windows-x86-portable.zip
            win_arch: x86
          # Keep Linux artifacts compatible with older supported distributions.
          # ubuntu-latest can move to a newer glibc and silently raise the runtime floor.
          - os: ubuntu-22.04
            asset: PS2Servers-linux-x64
            portable_asset: PS2Servers-linux-x64-portable.tar.gz
          - os: macos-latest
            asset: PS2Servers-macos-arm64.zip
          - os: macos-latest
            asset: PS2Servers-macos-x64.zip
            macos_arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Most jobs use setup-python. The macOS x86_64 cross-build instead needs a
      # universal2 interpreter (with universal Tcl/Tk) and must execute Python as
      # x86_64 so compiled dependencies like lz4 match the Intel artifact.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.macos_arch != 'x86_64' && matrix.win_arch != 'x86'
        with:
          python-version: "3.12"

      # The 32-bit Windows build needs a 32-bit interpreter (with 32-bit Tcl/Tk)
      # so Nuitka emits a 32-bit .exe and pip pulls the win32 wheels (lz4,
      # zstandard). setup-python provides an official 32-bit CPython.
      - name: Set up Python (Windows x86)
        if: matrix.win_arch == 'x86'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: "x86"

      - name: Install universal2 Python (macOS x86_64 cross-build)
        if: matrix.macos_arch == 'x86_64'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          curl -sSLO https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg
          echo "2ec2355c1b3225ce1075fc1b562a6e113017aa6177df87c410667638c1574a09  python-3.12.7-macos11.pkg" | shasum -a 256 -c -
          sudo installer -pkg python-3.12.7-macos11.pkg -target /
          PYBIN=/Library/Frameworks/Python.framework/Versions/3.12/bin
          sudo ln -sf "$PYBIN/python3" "$PYBIN/python"
          echo "$PYBIN" >> "$GITHUB_PATH"
          arch -x86_64 "$PYBIN/python3" -c 'import platform; print(platform.machine())'

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev libcurl4-openssl-dev

      # Optional Linux system-tray backend, bundled into the Linux build so the
      # AppImage has a working tray. best-effort: if this fails the build still
      # succeeds and the launcher just keeps close-to-quit (build.py only bundles
      # what is actually installed).
      - name: Install Linux tray backend (pystray)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: python -m pip install pystray Pillow python-xlib

      - name: Install Nuitka
        if: matrix.macos_arch != 'x86_64'
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Install Nuitka (macOS x86_64)
        if: matrix.macos_arch == 'x86_64'
        run: arch -x86_64 python -m pip install --upgrade pip -r requirements-build.txt

      - name: Build bundled libchdr
        if: matrix.macos_arch != 'x86_64'
        env:
          MACOS_TARGET_ARCH: ${{ matrix.macos_arch }}
          WINDOWS_TARGET_ARCH: ${{ matrix.win_arch }}
        run: python build/build_libchdr.py

      - name: Build bundled libchdr (macOS x86_64)
        if: matrix.macos_arch == 'x86_64'
        env:
          MACOS_TARGET_ARCH: ${{ matrix.macos_arch }}
        run: arch -x86_64 python build/build_libchdr.py

      - name: Build single-file binary
        if: matrix.macos_arch != 'x86_64'
        env:
          MACOS_TARGET_ARCH: ${{ matrix.macos_arch }}
        run: python build/build.py

      - name: Verify fresh-profile Windows desktop stays open
        if: runner.os == 'Windows'
        run: python tools/check_desktop_startup.py dist/PS2Servers.exe

      - name: Build single-file binary (macOS x86_64)
        if: matrix.macos_arch == 'x86_64'
        # Python is already executing as x86_64 here. Do not pass
        # MACOS_TARGET_ARCH to build.py, because that makes Nuitka enter its
        # cross-target path again and can reuse arm64 native extensions.
        run: arch -x86_64 python build/build.py

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $packageDir = "out/PS2Servers-windows-${{ matrix.win_arch || 'x64' }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -Path dist/PS2Servers.exe -Destination "$packageDir/PS2Servers.exe" -Force
          Copy-Item -Path ANTIVIRUS-NOTICE.md -Destination $packageDir -Force
          if (Test-Path build/native) {
            Copy-Item -Path build/native -Destination $packageDir -Recurse -Force
          }
          Compress-Archive -Path $packageDir -DestinationPath "out/${{ matrix.asset }}" -Force

      - name: Stage Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Linux)   cp dist/PS2Servers "out/${{ matrix.asset }}" ;;
            macOS)   app=$(ls -d dist/*.app | head -1)
                     ( cd dist && zip -r -y "../out/${{ matrix.asset }}" "$(basename "$app")" ) ;;
          esac

      - name: Write asset checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          asset = Path("out") / "${{ matrix.asset }}"
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          checksum = asset.with_name(asset.name + ".sha256.txt")
          checksum.write_text(f"{digest}  {asset.name}\n", encoding="utf-8")

      # Additional download for users whose antivirus flags the self-extracting
      # onefile: a plain standalone directory (no extraction bootstrap). Built only
      # for Windows/Linux (macOS already ships a standalone .app).
      - name: Build standalone portable build
        if: matrix.portable_asset != ''
        continue-on-error: true
        env:
          PS2_BUILD_MODE: standalone
        run: python build/build.py

      - name: Stage Windows portable artifact
        if: runner.os == 'Windows' && matrix.portable_asset != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $dist = Get-ChildItem dist -Directory -Filter *.dist | Select-Object -First 1
          if (-not $dist) { throw "standalone .dist folder not found in dist/" }
          $packageDir = "out/PS2Servers-windows-${{ matrix.win_arch || 'x64' }}-portable"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -Path "$($dist.FullName)/*" -Destination $packageDir -Recurse -Force
          Copy-Item -Path ANTIVIRUS-NOTICE.md -Destination $packageDir -Force
          Set-Content -Path "$packageDir/portable.txt" -Value "Portable build: settings are kept in the data folder next to this program. Delete this file to use the per-user settings folder instead."
          if (Test-Path build/native) {
            Copy-Item -Path build/native -Destination $packageDir -Recurse -Force
          }
          Compress-Archive -Path $packageDir -DestinationPath "out/${{ matrix.portable_asset }}" -Force

      - name: Stage Linux portable artifact
        if: runner.os == 'Linux' && matrix.portable_asset != ''
        continue-on-error: true
        shell: bash
        run: |
          dist=$(ls -d dist/*.dist 2>/dev/null | head -1)
          test -n "$dist"
          cp ANTIVIRUS-NOTICE.md "$dist/"
          echo "Portable build: settings are kept in the data folder next to this program. Delete this file to use the per-user settings folder instead." > "$dist/portable.txt"
          ( cd "$(dirname "$dist")" && tar -czf "$GITHUB_WORKSPACE/out/${{ matrix.portable_asset }}" "$(basename "$dist")" )

      # An AppImage wraps the same standalone build so Linux users get desktop /
      # menu shortcuts and AppImageLauncher integration (a tester request).
      # Fully optional: continue-on-error throughout, and every downstream step
      # sums/attaches it only if the file is present, so a hiccup here never
      # affects the primary Linux downloads. Files are written with printf, not
      # a heredoc, to avoid YAML indentation leaking into .desktop / AppRun.
      - name: Build Linux AppImage
        if: runner.os == 'Linux' && matrix.portable_asset != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dist=$(ls -d dist/*.dist 2>/dev/null | head -1)
          test -n "$dist"
          APPDIR="$RUNNER_TEMP/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp -a "$dist"/. "$APPDIR/usr/bin/"
          test -x "$APPDIR/usr/bin/PS2Servers"
          # zsync provides zsyncmake, which appimagetool uses to generate the
          # delta-update metadata file when -u is supplied.
          sudo apt-get install -y imagemagick libfuse2 zsync >/dev/null 2>&1 || true
          if command -v convert >/dev/null 2>&1; then
            convert launcher/assets/theme/LOGO.png -resize 256x256 "$APPDIR/ps2servers.png" \
              || cp launcher/assets/theme/LOGO.png "$APPDIR/ps2servers.png"
          else
            cp launcher/assets/theme/LOGO.png "$APPDIR/ps2servers.png"
          fi
          printf '%s\n' \
            '[Desktop Entry]' 'Type=Application' 'Name=PS2 Servers' \
            'Comment=Load PS2 games, apps and homebrew over your LAN' \
            'Exec=PS2Servers' 'Icon=ps2servers' \
            'Categories=Network;Game;Utility;' 'Terminal=false' \
            > "$APPDIR/ps2servers.desktop"
          printf '%s\n' \
            '#!/bin/bash' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/PS2Servers" "$@"' \
            > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/PS2Servers"
          # Pin appimagetool to a tagged release and verify its digest before we
          # execute it. 'continuous' is a rolling tag -- pinning + a checksum
          # gate means a changed or tampered build can't silently run on the
          # runner and wrap itself around our binary. set -e aborts the step on
          # a mismatch (and the step is continue-on-error, so a bad hash drops
          # the AppImage without blocking the real Linux downloads).
          APPIMAGETOOL_VERSION="1.9.1"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          TOOL="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$TOOL" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  ${TOOL}" | sha256sum -c -
          chmod +x "$TOOL"
          mkdir -p out
          # Embed AppImageUpdate metadata. Stable builds follow GitHub's latest
          # stable release; prerelease builds stay on the prerelease channel.
          UPDATE_CHANNEL="latest"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            UPDATE_CHANNEL="latest-pre"
          fi
          UPDATE_INFO="gh-releases-zsync|NathanNeurotic|PS2-Servers|${UPDATE_CHANNEL}|PS2Servers-x86_64.AppImage.zsync"

          # --appimage-extract-and-run runs the tool without needing FUSE on the runner.
          # appimagetool -u embeds UPDATE_INFO and invokes zsyncmake to create
          # PS2Servers-x86_64.AppImage.zsync next to the AppImage.
          ARCH=x86_64 "$TOOL" --appimage-extract-and-run \
            -u "$UPDATE_INFO" "$APPDIR" \
            "$GITHUB_WORKSPACE/out/PS2Servers-x86_64.AppImage"
          chmod +x "out/PS2Servers-x86_64.AppImage"

          # appimagetool invokes zsyncmake from the current working directory,
          # so the generated .zsync lands at the repository root even though
          # the AppImage itself is written under out/. Move it beside the
          # AppImage before checksumming/uploading.
          if [ -f "PS2Servers-x86_64.AppImage.zsync" ]; then
            mv "PS2Servers-x86_64.AppImage.zsync" "out/PS2Servers-x86_64.AppImage.zsync"
          fi
          test -f "out/PS2Servers-x86_64.AppImage.zsync"
          ls -la "out/PS2Servers-x86_64.AppImage" "out/PS2Servers-x86_64.AppImage.zsync"

      - name: Write AppImage checksum
        if: runner.os == 'Linux' && matrix.portable_asset != ''
        continue-on-error: true
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          for name in (
              "PS2Servers-x86_64.AppImage",
              "PS2Servers-x86_64.AppImage.zsync",
          ):
              asset = Path("out") / name
              if asset.exists():
                  digest = hashlib.sha256(asset.read_bytes()).hexdigest()
                  asset.with_name(asset.name + ".sha256.txt").write_text(
                      f"{digest}  {asset.name}\n", encoding="utf-8")

      - name: Write portable asset checksum
        if: matrix.portable_asset != ''
        continue-on-error: true
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          asset = Path("out") / "${{ matrix.portable_asset }}"
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          checksum = asset.with_name(asset.name + ".sha256.txt")
          checksum.write_text(f"{digest}  {asset.name}\n", encoding="utf-8")

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/${{ matrix.asset }}

      - name: Attest portable build provenance
        if: matrix.portable_asset != ''
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/${{ matrix.portable_asset }}

      - name: Attest Linux AppImage provenance
        # Same non-blocking contract as the AppImage build itself: only on Linux,
        # and never fail the release if the AppImage wasn't produced.
        if: runner.os == 'Linux' && matrix.portable_asset != ''
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/PS2Servers-x86_64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: |
            out/${{ matrix.asset }}
            out/${{ matrix.asset }}.sha256.txt

      - name: Upload portable build artifact
        if: matrix.portable_asset != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.portable_asset }}
          path: |
            out/${{ matrix.portable_asset }}
            out/${{ matrix.portable_asset }}.sha256.txt

      # The AppImage used to be attached to the release straight from this job
      # and was never uploaded as an artifact. Now that publishing happens in a
      # later job, it has to travel there like everything else or it would
      # silently stop appearing on releases.
      #
      # if-no-files-found: ignore because the AppImage build is best-effort --
      # a missing one must not turn into a failed upload step.
      - name: Upload Linux AppImage artifact
        if: runner.os == 'Linux' && matrix.portable_asset != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PS2Servers-x86_64.AppImage
          if-no-files-found: ignore
          path: |
            out/PS2Servers-x86_64.AppImage
            out/PS2Servers-x86_64.AppImage.sha256.txt
            out/PS2Servers-x86_64.AppImage.zsync
            out/PS2Servers-x86_64.AppImage.zsync.sha256.txt

  # The source archive was built only for rolling pre-releases, so tagged
  # releases never carried one -- while the shared notes told readers to "use
  # PS2Servers-source.zip" for the lowest-trust path. That is the download for
  # anyone who will not run a binary they cannot inspect, which makes it exactly
  # the wrong one to be missing from the releases people are pointed at.
  #
  # The shared Edge job supplies artifacts to this run's generated download table.
  source:
    name: Package source archive
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create portable source zip
        shell: bash
        run: git archive --format=zip --output=PS2Servers-source.zip HEAD

      - name: Write source checksum
        shell: bash
        run: sha256sum PS2Servers-source.zip > PS2Servers-source.zip.sha256.txt

      - name: Generate source attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: PS2Servers-source.zip

      - name: Upload source artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PS2Servers-source.zip
          path: |
            PS2Servers-source.zip
            PS2Servers-source.zip.sha256.txt
          if-no-files-found: error

  edge:
    name: Build Edge binaries
    needs: verify-version
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/edge-build.yml

  # Publish once, after the notes generator has seen every available artifact.
  release:
    name: Publish release
    needs:
      - build
      - source
      - create-release
      - edge
    # Tags publish only after the required Edge artifacts arrive. Optional
    # desktop variants retain their existing fallback behavior. Manual test
    # builds skip Edge and never publish.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.edge.result == 'success' }}
    runs-on: ubuntu-latest
    # Narrower than the workflow-level block: this job publishes, it does not
    # attest, so it has no use for id-token or attestations.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only .github/release-notes-common.md is read here and no git command
          # follows, so the token has no reason to stay in the runner's config.
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: List what actually built
        shell: bash
        run: ls -la release-assets

      - name: Compose release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"

          # List only files produced by this run, with fallbacks for optional builds.
          cd release-assets
          export RELEASE_TAG="$TAG"
          source "$GITHUB_WORKSPACE/.github/scripts/release-downloads.sh"
          no_portable="portable build unavailable in this release"
          no_onefile="single-file build unavailable in this release"
          table=$(
            row "Windows, normal (64-bit)"   PS2Servers-windows-x64-portable.zip   PS2Servers-windows-x64.zip           "$no_portable"
            row_alternative PS2Servers-windows-x64-portable.zip PS2Servers-windows-x64.zip "Windows, 64-bit single-file alternative"
            row "Windows, older 32-bit PC"   PS2Servers-windows-x86-portable.zip   PS2Servers-windows-x86.zip           "$no_portable"
            row_alternative PS2Servers-windows-x86-portable.zip PS2Servers-windows-x86.zip "Windows, 32-bit single-file alternative"
            row "Linux, x86_64"              PS2Servers-linux-x64                  PS2Servers-linux-x64-portable.tar.gz "$no_onefile"
            row_alternative PS2Servers-linux-x64 PS2Servers-linux-x64-portable.tar.gz "Linux, x86_64 standalone folder"
            if [ -f PS2Servers-x86_64.AppImage ]; then
              row "Linux desktop, x86_64 AppImage" PS2Servers-x86_64.AppImage "" ""
            fi
            row "Mac, Apple Silicon (M1–M4)" PS2Servers-macos-arm64.zip            ""                                   ""
            row "Mac, Intel"                 PS2Servers-macos-x64.zip              ""                                   ""
            row "Source / inspection"        PS2Servers-source.zip                 ""                                   ""
            edge_rows
          )
          # A leg that failed outright now leaves its row out rather than
          # blocking the release, so say so where a maintainer will see it.
          for expected in PS2Servers-windows-x64.zip PS2Servers-windows-x86.zip \
                          PS2Servers-linux-x64 PS2Servers-macos-arm64.zip PS2Servers-macos-x64.zip; do
            [ -f "$expected" ] || echo "::warning::$expected is absent; its build leg did not finish, and this release will publish without it"
          done
          if [ -z "$table" ]; then
            echo "no downloadable assets were produced; refusing to publish empty notes" >&2
            exit 1
          fi
          cd ..

          # Quoted heredoc: the text is written literally, so backticks and
          # dollar signs need no escaping and the placeholders are substituted
          # afterwards. The previous unquoted version had to backslash-escape
          # every backtick in the notes.
          cat > "$notes" <<'HEADER'
          Built from the tagged `__TAG__` source.

          ## Downloads

          | Platform / purpose | Asset |
          |---|---|
          __DOWNLOADS_TABLE__
          HEADER

          # Passed through the environment rather than interpolated into the
          # script, so a value containing quotes or backslashes stays literal.
          export DOWNLOADS_TABLE="$table"
          python3 - "$notes" <<'PYSUB'
          import os, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s = s.replace("__TAG__", os.environ["TAG"])
          s = s.replace("__DOWNLOADS_TABLE__", os.environ["DOWNLOADS_TABLE"].rstrip())
          open(p, "w", encoding="utf-8").write(s)
          PYSUB

          # Append the short shared changelog, excluding its maintainer comment.
          sed '/^<!--/,/^-->/d' .github/release-notes-common.md >> "$notes"

          echo "path=$notes" >> "$GITHUB_OUTPUT"

      # A tag with a '-' qualifier (v0.4.5-rc1, v0.5.0-beta2) is a pre-release:
      # publish it as such and never let it take the "Latest" badge from the
      # current stable tag. A plain vX.Y.Z tag is a normal release and does.
      - name: Attach to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: PS2 Servers ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          # Include desktop and Edge archives plus their checksums. Unmatched
          # optional files are skipped so an absent build does not block release.
          files: |
            release-assets/PS2Servers-*
            release-assets/PS2ServersEdge-*.tar.gz
            release-assets/PS2ServersEdge-*.zip
            release-assets/PS2ServersEdge-*.sha256
