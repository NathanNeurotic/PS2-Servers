name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  achievements-engine:
    name: RetroAchievements engine (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, target: windows-x64, win_arch: x64}
          - {os: windows-latest, target: windows-x86, win_arch: x86}
          - {os: ubuntu-22.04, target: linux-x64}
          - {os: macos-latest, target: macos-arm64}
          - {os: macos-latest, target: macos-x64, mac_arch: x86_64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libcurl4-openssl-dev
      - name: Build pinned achievement engine
        env:
          WINDOWS_TARGET_ARCH: ${{ matrix.win_arch }}
          MACOS_TARGET_ARCH: ${{ matrix.mac_arch }}
        run: python build/build_achievements.py
      - name: Exercise native discovery, credential protection and companion wire protocols
        run: python -m unittest tests.test_retroachievements tests.test_game_library tests.test_achievement_viewer tests.test_achievement_loader tests.test_discord_presence -v

  windows-storage:
    name: Windows raw and virtual storage tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Exercise native APIs and real PowerShell script with synthetic storage
        run: python -m unittest tests.test_raw_storage tests.test_udpbd_storage_modes tests.test_library_panel -v

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Go
        # For tests/test_smb_wire_parity.py, which compares Edge's SMB bytes
        # against the Python server's. Without a toolchain it skips, and a skip
        # nobody reads is the same as not having the test.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/ps2servers-edge/go.mod
          cache-dependency-path: native/ps2servers-edge/go.mod

      - name: Install test dependencies
        # PyYAML parses workflow fixtures; Pillow exercises artwork handling;
        # LZ4 must be installed so compressed ZSO inspection cannot silently skip.
        run: python -m pip install --disable-pip-version-check PyYAML Pillow lz4

      - name: Compile Python sources
        run: python -m compileall -q launcher smbv1_server smb2_server udpbd_server udpfs_server http_server ps2servers.py

      - name: Install independent exFAT validator
        run: sudo apt-get update -qq && sudo apt-get install -y exfatprogs

      - name: Run the Python test suite
        # Discovery, not a hand-written list. This step used to name exactly one
        # module -- tests.test_packaging_data_files -- so 23 of the 26 modules
        # in tests/ gated nothing, and a failing assertion in
        # test_edge_service_modes sat on main with every workflow green.
        #
        # The GUI tests skip themselves where there is no display, so this is
        # safe on a headless runner; see tests/test_gui_layout.py.
        run: python -m unittest discover -s tests -t . -v

      - name: Check release compliance posture
        run: python tools/check_release_compliance.py

      - name: Run pinned OPL HTTP client conformance
        run: python conformance/integration/opl_http/run.py

      - name: Run pinned RiptOPL HTTP catalogue conformance
        run: python conformance/integration/riptopl_http/run.py

      - name: Run pinned Neutrino SMB client (usmb2) conformance
        # Builds the real client from Neutrino PR #236 and reads a game through
        # smb2_server on loopback. Host protocol check, not PS2 hardware.
        run: python conformance/integration/neutrino_smb/run.py

      - name: Run UDPBD protocol selftest
        run: python udpbd_server/selftest.py

      - name: Run UDPFS multi-client selftest
        run: python udpfs_server/multiclient_selftest.py

      - name: Run UDPFS compression listing selftest
        run: python udpfs_server/compression_selftest.py

      - name: Run UDPFS path-guard selftest
        run: python udpfs_server/pathguard_selftest.py

      - name: Smoke build bundled libchdr
        run: python build/build_libchdr.py

      - name: Verify real CHD decoding, strict inspection and RA hash
        run: |
          python -c "import sys; sys.path.insert(0, 'udpfs_server'); from compressed_iso.chd import LIBCHDR_AVAILABLE; assert LIBCHDR_AVAILABLE, 'bundled libchdr must load'"
          python -m unittest -v \
            tests.test_ra_compressed_hash.CompressionHashTests.test_real_chd_decoder_matches_synthetic_iso_and_hash \
            tests.test_ra_compressed_hash.CompressionHashTests.test_real_chd_strict_sparse_reads_limits_and_cancellation \
            tests.test_disc_identity.DiscIdentityTests.test_real_chd_identity_matches_iso_without_changing_source
