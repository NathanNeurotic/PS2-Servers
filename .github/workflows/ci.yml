name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Go
        # For tests/test_smb_wire_parity.py, which compares Edge's SMB bytes
        # against the Python server's. Without a toolchain it skips, and a skip
        # nobody reads is the same as not having the test.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/ps2servers-edge/go.mod
          cache-dependency-path: native/ps2servers-edge/go.mod

      - name: Compile Python sources
        run: python -m compileall -q launcher smbv1_server smb2_server udpbd_server udpfs_server ps2servers.py

      - name: Run the Python test suite
        # Discovery, not a hand-written list. This step used to name exactly one
        # module -- tests.test_packaging_data_files -- so 23 of the 26 modules
        # in tests/ gated nothing, and a failing assertion in
        # test_edge_service_modes sat on main with every workflow green.
        #
        # The GUI tests skip themselves where there is no display, so this is
        # safe on a headless runner; see tests/test_gui_layout.py.
        run: python -m unittest discover -s tests -t . -v

      - name: Check release compliance posture
        run: python tools/check_release_compliance.py

      - name: Run UDPBD protocol selftest
        run: python udpbd_server/selftest.py

      - name: Run UDPFS multi-client selftest
        run: python udpfs_server/multiclient_selftest.py

      - name: Run UDPFS compression listing selftest
        run: python udpfs_server/compression_selftest.py

      - name: Run UDPFS path-guard selftest
        run: python udpfs_server/pathguard_selftest.py

      - name: Smoke build bundled libchdr
        run: python build/build_libchdr.py
