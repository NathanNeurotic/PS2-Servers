name: Android Debug APK

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-debug:
    name: Build & test Android APK (API 21+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts

      - name: Run unit tests, lint, and assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Verify APK API levels and inspect manifest metadata
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -n 1)"
          test -n "$AAPT2"
          "$AAPT2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
          grep -qE "(minSdk|sdk)Version:'21'" /tmp/apk-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/apk-badging.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ps2-servers-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
