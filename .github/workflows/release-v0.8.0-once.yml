name: One-shot v0.8.0 release trigger

on:
  push:
    branches:
      - release-trigger/v0.8.0

permissions:
  contents: write
  actions: write

jobs:
  publish:
    name: Tag v0.8.0 and dispatch release
    runs-on: ubuntu-latest
    steps:
      - name: Check out trigger branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify source version
        run: python3 tools/version_source.py --check-tag v0.8.0

      - name: Tag current main and dispatch tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "Tagging main commit ${MAIN_SHA}"
          git show "${MAIN_SHA}:launcher/release_metadata.py" | grep -F 'PRODUCT_VERSION = "0.8.0"'

          if git rev-parse -q --verify refs/tags/v0.8.0 >/dev/null; then
            echo "v0.8.0 already exists; leaving it unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.8.0 "${MAIN_SHA}" -m "PS2 Servers v0.8.0"
            git push origin refs/tags/v0.8.0
          fi

          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v0.8.0
