name: UDPFS Neutrino compatibility replay
on:
  pull_request:
    paths:
      - udpfs_server/**
      - tools/replay_neutrino_udpfs.py
      - .github/workflows/udpfs-transport-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ps2max32/neutrino
          ref: 7be8de2798c99af433c91993e021746a54d6800d
          path: .replay/official
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ps2max32/neutrino
          ref: f12b4f51b5112928eb06e29fd91511251c0b29f1
          path: .replay/stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NathanNeurotic/neutrino
          ref: e6f139240e3e64beb34807d2e9ba90a9def80ae6
          path: .replay/fixed
      - name: Compare real clients against the server before and after the workaround
        run: |
          python3 tools/replay_neutrino_udpfs.py --drop-request-ack \
            --official-source .replay/official --stable-source .replay/stable \
            --fixed-source .replay/fixed --server-source . --server-before 07210f3f1c200b6e4b95eba47b9667e58220765a --output replay-results/data
          python3 tools/replay_neutrino_udpfs.py --drop-request-ack --rpc \
            --official-source .replay/official --stable-source .replay/stable \
            --fixed-source .replay/fixed --server-source . --server-before 07210f3f1c200b6e4b95eba47b9667e58220765a --output replay-results/rpc
          python3 tools/replay_neutrino_udpfs.py --stale-control \
            --official-source .replay/official --stable-source .replay/stable \
            --fixed-source .replay/fixed --server-source . --server-before 07210f3f1c200b6e4b95eba47b9667e58220765a --output replay-results/control
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: neutrino-compatibility-replay
          path: replay-results/**/transport-replay-results.json
