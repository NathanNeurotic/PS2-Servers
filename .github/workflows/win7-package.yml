name: Windows 7 package

# Builds the 32-bit Windows package exactly as the release workflows do (Python
# 3.8.10, x86, build/requirements-win7.txt) and checks it can load on Windows 7,
# before a change to the build reaches a release. Issue #330 was a 32-bit
# package built with Python 3.12, which cannot start on Windows 7 at all.
#
# Only for pull requests that touch the build; the release workflows run the
# same check on every release, and workflow_dispatch runs it on demand.

on:
  pull_request:
    paths:
      - build/**
      - requirements-build.txt
      - tools/check_win7_imports.py
      - tools/check_desktop_startup.py
      - .github/workflows/win7-package.yml
      - .github/workflows/release.yml
      - .github/workflows/release-on-main.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and check the Windows 7 (x86) package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.8.10'
          architecture: 'x86'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/requirements-win7.txt
      - name: Build bundled libchdr
        env:
          WINDOWS_TARGET_ARCH: x86
        run: python build/build_libchdr.py
      - name: Build the single-file package
        run: python build/build.py
      - name: Check it can load on Windows 7
        shell: pwsh
        run: |
          $paths = @('dist/PS2Servers.exe')
          if (Test-Path build/native) { $paths += 'build/native' }
          python tools/check_win7_imports.py @paths
      - name: Verify fresh-profile desktop stays open
        run: python tools/check_desktop_startup.py dist/PS2Servers.exe
      - name: Build the portable package
        env:
          PS2_BUILD_MODE: standalone
        run: python build/build.py
      - name: Check every bundled DLL and module can load on Windows 7
        shell: pwsh
        run: |
          $dist = Get-ChildItem dist -Directory -Filter *.dist | Select-Object -First 1
          if (-not $dist) { throw "standalone .dist folder not found in dist/" }
          python tools/check_win7_imports.py $dist.FullName
