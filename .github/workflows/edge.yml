name: PS2 Servers Edge

on:
  pull_request:
    paths:
      - "native/ps2servers-edge/**"
      - "udpfs_server/**"
      - "launcher/servers.py"
      - "ps2servers.py"
      - "conformance/**"
      - "packaging/**"
      - "docs/EDGE*.md"
      - "docs/EDITIONS.md"
      - "docs/OPENWRT.md"
      - "docs/PROTOCOL-COMPATIBILITY.md"
      - "docs/THIRD-PARTY.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/edge.yml"
      # The reusable workflow holds the entire build matrix and the packaging
      # script, so a change there affects every target. Without this path a PR
      # editing only edge-build.yml runs no Edge builds at all -- which is
      # exactly what happened on the PR that added this line.
      - ".github/workflows/edge-build.yml"
  push:
    branches: [main]
    tags: ["v*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Edge and Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/ps2servers-edge/go.mod
          cache-dependency-path: native/ps2servers-edge/go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test and vet Edge
        working-directory: native/ps2servers-edge
        run: |
          go test -race ./... -count=1
          go vet ./...
      - name: Test Python protocol negotiation and launcher compatibility
        run: |
          python -m unittest tests.test_udpfs_protocol_negotiation -v
          python -m unittest tests.test_udpfs_config -v
          python -m py_compile udpfs_server/ps2servers_core.py launcher/servers.py ps2servers.py conformance/integration/udpfs_probe.py
      - name: Run existing UDPFS self-tests
        run: |
          python udpfs_server/multiclient_selftest.py
          python udpfs_server/pathguard_selftest.py
          python udpfs_server/compression_selftest.py

      # Drives the shared conformance probe against a real Edge process over
      # real UDP sockets: standards client plus three Modulo-shaped ones,
      # concurrently, covering the 4095 -> 0 sequence wrap and comparing
      # returned bytes against the source file. Go unit tests exercise Edge's
      # own helpers; this checks the bytes it actually puts on the wire, which
      # is the part that has to match a console.
      #
      # This earns the "integration tested" label in conformance/README.md.
      # It is NOT a hardware claim -- see docs/EDGE.md validation status.
      - name: UDPFS conformance probe against Edge
        shell: bash
        run: |
          set -euo pipefail
          port=62966
          root="$(mktemp -d)"
          # Deterministic fixture so a failure is reproducible. Keep it inside
          # one UDPRDMA payload (MaxPayload is 1408): the probe compares the
          # bytes from a single READ reply and does not reassemble a fragmented
          # transfer, so a larger fixture reports a false "READ mismatch"
          # against a perfectly healthy server -- verified by reproducing that
          # against the Python core as well as Edge.
          python - "$root/probe.iso" <<'PYFIX'
          import sys
          with open(sys.argv[1], "wb") as f:
              f.write(bytes([(i * 7) & 0xFF for i in range(1024)]))
          PYFIX

          go build -o "$RUNNER_TEMP/ps2servers-edge" ./cmd/ps2servers-edge
          "$RUNNER_TEMP/ps2servers-edge" udpfs --root "$root" --bind 127.0.0.1 --port "$port" &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true' EXIT

          # Wait for the discovery socket to be bound. A UDP connect() always
          # succeeds, so poll the listening table instead of probing blindly.
          for _ in $(seq 1 50); do
            if ss -lun 2>/dev/null | grep -q ":${port}\b"; then break; fi
            sleep 0.2
          done
          if ! kill -0 "$edge_pid" 2>/dev/null; then
            echo "::error::Edge exited before the probe could run"
            exit 1
          fi

          python "$GITHUB_WORKSPACE/conformance/integration/udpfs_probe.py" \
            --host 127.0.0.1 --port "$port" --root "$root" --path probe.iso
        working-directory: native/ps2servers-edge

  build:
    name: Build Edge
    needs: test
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Matrix and packaging live in edge-build.yml so this workflow and
    # release-on-main.yml cannot drift apart.
    uses: ./.github/workflows/edge-build.yml

  openwrt-source-check:
    name: Check OpenWrt package source
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate package files
        run: |
          set -euo pipefail
          test -x packaging/openwrt/files/ps2servers-edge.init
          grep -q 'include ../../lang/golang/golang-package.mk' packaging/openwrt/Makefile
          grep -q 'procd_set_param user ps2edge' packaging/openwrt/files/ps2servers-edge.init
          grep -q "option protocol 'auto'" packaging/openwrt/files/ps2servers-edge.config
          ! grep -R --line-number -E 'Architecture: (mips|arm|amd64)' packaging/openwrt
